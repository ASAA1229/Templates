name: Temporary blueprint formatting
on:
  push:
    branches: [new]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[auto-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier formatting
        run: |
          npx prettier --write \
            apps/api/test/generation.test.ts \
            apps/api/test/generator-adapters.test.ts \
            apps/web/src/features/generation/NewProjectWizard.tsx \
            packages/contracts/src/index.ts \
            apps/web/src/features/generation/GenerationPanel.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/generation.test.ts apps/api/test/generator-adapters.test.ts apps/web/src/features/generation/NewProjectWizard.tsx packages/contracts/src/index.ts apps/web/src/features/generation/GenerationPanel.tsx
          git commit -m "style(templates): apply Prettier formatting [auto-format]"
          git push origin HEAD:new
