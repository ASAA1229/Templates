# Continuous validation (US-H02). Runs on GitHub-hosted runners within the free
# monthly allowance; no paid services, registries or secrets are required.
# Database: ephemeral PostgreSQL service container with throwaway credentials.
name: CI

on:
  push:
    branches: [new, dev, fix, test]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # Ephemeral CI-only database; not a secret and not used anywhere else.
  DATABASE_URL: postgresql://templates:templates_ci@127.0.0.1:5432/templates_ci?schema=public
  TEST_DATABASE_URL: postgresql://templates:templates_ci@127.0.0.1:5432/templates_ci?schema=public

jobs:
  validate:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: templates
          POSTGRES_PASSWORD: templates_ci
          POSTGRES_DB: templates_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U templates" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Temporary formatting repair for blueprint integration
        if: github.event_name == 'push' && github.ref == 'refs/heads/new' && !contains(github.event.head_commit.message, '[auto-format]')
        run: |
          npx prettier --write \
            apps/api/test/generation.test.ts \
            apps/api/test/generator-adapters.test.ts \
            apps/web/src/features/generation/NewProjectWizard.tsx \
            apps/web/src/features/generation/GenerationPanel.tsx \
            apps/web/src/test/generation.test.tsx \
            packages/contracts/src/index.ts \
            apps/api/src/modules/generation/project-template-submissions.ts \
            apps/web/src/features/templates/ProjectTemplateContribution.tsx \
            apps/web/src/features/templates/TemplateSubmissionsPage.tsx \
            apps/web/src/features/security/TeamMembersPage.tsx \
            apps/web/src/features/projects/ProjectDetailPage.tsx \
            apps/web/src/App.tsx \
            apps/web/src/components/AppShell.tsx \
            apps/api/src/modules/auth/auth.ts \
            apps/api/src/modules/auth/policy.ts \
            apps/api/src/context.ts \
            apps/api/src/modules/audit/audit.service.ts \
            apps/api/src/cli/owner.ts \
            apps/api/test/auth.test.ts \
            apps/api/test/helpers.ts \
            apps/api/test/policy.test.ts \
            apps/web/src/features/auth/AccessRequestPage.tsx \
            apps/web/src/features/auth/ActivateAccountPage.tsx \
            apps/web/src/features/security/AccessRequestsPage.tsx \
            apps/web/src/features/projects/ProjectMembersPanel.tsx \
            apps/api/src/modules/projects/projects.ts \
            apps/api/src/modules/requirements/requirements.ts \
            apps/api/src/modules/workspace/workspace.ts \
            apps/api/src/modules/dashboard/dashboard.ts \
            apps/api/src/modules/search/search.ts \
            apps/api/test/project-sharing.test.ts \
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/test/generation.test.ts apps/api/test/generator-adapters.test.ts apps/web/src/features/generation/NewProjectWizard.tsx apps/web/src/features/generation/GenerationPanel.tsx apps/web/src/test/generation.test.tsx packages/contracts/src/index.ts apps/api/src/modules/generation/project-template-submissions.ts apps/web/src/features/templates/ProjectTemplateContribution.tsx apps/web/src/features/templates/TemplateSubmissionsPage.tsx apps/web/src/features/security/TeamMembersPage.tsx apps/web/src/features/projects/ProjectDetailPage.tsx apps/web/src/App.tsx apps/web/src/components/AppShell.tsx apps/api/src/modules/auth/auth.ts apps/api/src/modules/auth/policy.ts apps/api/src/context.ts apps/api/src/modules/audit/audit.service.ts apps/api/src/cli/owner.ts apps/api/test/auth.test.ts apps/api/test/helpers.ts apps/api/test/policy.test.ts apps/web/src/features/auth/AccessRequestPage.tsx apps/web/src/features/auth/ActivateAccountPage.tsx apps/web/src/features/security/AccessRequestsPage.tsx apps/web/src/features/projects/ProjectMembersPanel.tsx apps/api/src/modules/projects/projects.ts apps/api/src/modules/requirements/requirements.ts apps/api/src/modules/workspace/workspace.ts apps/api/src/modules/dashboard/dashboard.ts apps/api/src/modules/search/search.ts apps/api/test/project-sharing.test.ts apps/api/prisma/schema.prisma
            git commit -m "style(templates): apply Prettier formatting [auto-format]"
            git push origin HEAD:new
          fi
      - name: Dependency audit (fails on high/critical)
        run: npm run audit:deps
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Validate (format, lint, typecheck, unit + integration tests, build)
        run: npm run validate
      - name: Smoke test built application
        run: npm run smoke
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
